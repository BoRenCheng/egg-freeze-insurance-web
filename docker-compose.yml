# 一鍵啟動：docker compose up --build
# 服務啟動後訪問 http://localhost:5000
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: egg-freeze-insurance:latest
    container_name: egg-freeze-app
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_PATH: /data/insurance.db
      # 從根目錄 .env 讀取敏感資訊
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      # SQLite 資料持久化：容器刪除後資料仍保留
      - sqlite-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  sqlite-data:
    driver: local
